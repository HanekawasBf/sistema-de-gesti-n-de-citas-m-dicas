{% extends 'citas/base.html' %}

{% block titulo %}{{ titulo }}{% endblock %}

{% block contenido %}
    <h2>{{ titulo }}</h2>

    <form method="post" novalidate class="formulario">
        {% csrf_token %}

        {% for campo in form %}
        <div class="campo">
            {{ campo.label_tag }}
            {{ campo }}
            {% for error in campo.errors %}
                <p class="error">{{ error }}</p>
            {% endfor %}
        </div>
        {% endfor %}

        <button type="submit" class="boton">Guardar</button>
        <a href="{% url volver %}" class="boton secundario">Cancelar</a>
    </form>
{% endblock %}
