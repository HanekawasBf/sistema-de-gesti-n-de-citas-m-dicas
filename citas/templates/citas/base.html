{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}Consultorio Médico{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'citas/estilos.css' %}">
</head>
<body>
    <header>
        <h1>Consultorio Médico</h1>
    </header>

    <nav>
        <a href="{% url 'inicio' %}">Inicio</a>
        <a href="{% url 'lista_pacientes' %}">Pacientes</a>
        <a href="{% url 'lista_citas' %}">Citas</a>
        <a href="{% url 'citas_pendientes' %}">Pendientes</a>
    </nav>

    <main>
        {% if messages %}
            {% for mensaje in messages %}
                <div class="mensaje {{ mensaje.tags }}">{{ mensaje }}</div>
            {% endfor %}
        {% endif %}

        {% block contenido %}{% endblock %}
    </main>

    <footer>
        <p>&copy; 2026 Consultorio Médico</p>
    </footer>
</body>
</html>
